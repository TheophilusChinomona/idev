name: validate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static validation
        run: bash scripts/validate.sh
      - name: Install pytest
        run: pip install pytest
      - name: Tests
        run: python3 -m pytest tests/ -v
